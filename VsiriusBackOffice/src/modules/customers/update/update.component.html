<div class="card ">
    <form #myForm="ngForm" autocomplete="off" (ngSubmit)="save()">
      <div class="card-body ">
        <div class="row">
          <div class="col-xxl-2 col-xl-2 col-md-3 row align-items-center justify-content-evenly">
            <!-- <label class=" text-letter form-label fw-bold">Image</label><br> -->
            <div class="image-input avatar xl rounded-4" style="background-image: url({{image}})">
              <!-- <div class="avatar-wrapper rounded-circle"></div> -->
              <div class="file-input">
                <input type="file" #imageRef class="form-control" (change)="selectFileImage($event)" name="file-input"
                  id="file-input6">
                <label for="file-input6" class="fa fa-pencil shadow"></label>
              </div>
            </div>
          </div>
          <div class="row g-3 col-10 ">
            <div class="col-6 col-md-6">
              <label for="TextInput" class="form-label fw-bold">UserName <span class="text-danger">*</span></label>
              <input type="text" class="form-control" placeholder="Enter Field Name... " name="userName"
                [(ngModel)]="customerModel.userName" #userName="ngModel" required />
              <div class="text-danger mt-2 d-flex align-items-center"
                *ngIf="userName.invalid && (userName.touched || userName.dirty || checkValidated)">
                <span>*Please enter userName </span>
              </div>
            </div>
            <div class="col-lg-6 col-md-6">
              <label for="TextInput" class="form-label fw-bold">Email<span class="text-danger">*</span></label>
              <input type="text" placeholder="Enter Email..." class="form-control" name="email"
                [(ngModel)]="customerModel.email" #email="ngModel" required />
              <div class="text-danger mt-2 d-flex align-items-center"
                *ngIf="email.invalid && (email.touched || email.dirty || checkValidated)">
                <span>*Please enter Email </span>
              </div>
            </div>
            <div class="col-lg-6 col-md-6">
              <label for="TextInput" class="form-label fw-bold">Phone Number</label>
              <input type="text" placeholder="Enter Value..." class="form-control" name="phoneNumber"
                [(ngModel)]="customerModel.phoneNumber"/>
            </div>
            <div class="col-lg-6 col-md-6">
              <label for="TextInput" class="form-label fw-bold">Password </label>
              <input type="text" placeholder="Enter Product Type..." class="form-control" name="password"
                [(ngModel)]="customerModel.password"  />
             
            </div>
            <div class="col-lg-6 col-md-6">
              <label for="TextInput" class="form-label fw-bold">Address</label>
              <input type="text" placeholder="Enter Group Name..." class="form-control" name="address"
                [(ngModel)]="customerModel.address"  />
            </div>
            <div class=" col-md-12">
              <div class="form-check form-switch mt-2">
                <input class="form-check-input" type="checkbox" name="isActive" role="switch" id="isActive"
                  [checked]="customerModel.isActive" [(ngModel)]="customerModel.isActive" />
                <label class="form-check-label fw-bold" for="isActive">Is Active</label>
              </div>
            </div>
          </div>
        </div>
        <div class="card-footer text-end mt-5">
          <button class="btn btn-success me-2 lift rounded-2" type="submit">
            <i class="fa fa-save"></i> Save
          </button>
          <button class="btn btn-danger lift rounded-2" type="button" (click)="cancel()">
            <i class="fa fa-close"></i>
            Cancel
          </button>
        </div>
      </div>
    </form>
  </div>

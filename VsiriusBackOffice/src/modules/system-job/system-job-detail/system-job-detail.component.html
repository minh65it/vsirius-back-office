<div class="modal-header">
  <h4 class="modal-title pull-left">Job {{dataDetail.tittle}} Detail</h4>
  <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="hideModal()">
    <span aria-hidden="true" class="visually-hidden">&times;</span>
  </button>
</div>
<form #myForm="ngForm" autocomplete="off" (ngSubmit)="update()">
  <div class="modal-body">
    <div class="card-body ">
      <div class="row">
        <div class="row g-3 col-xl-12 col-md-12">
          <div class="col-xl-12 col-md-12">
            <label for="TextInput" class="form-label fw-bold">Description</label>
            <textarea class="form-control" [(ngModel)]="dataDetail.description" placeholder="Enter description..."
              name="description" id="description" rows="3"></textarea>
          </div>
          <div class="col-xl-3 col-md-12">
            <label for="TextInput" class="form-label fw-bold">&nbsp;</label>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" name="isStop" role="switch" id="isStop"
                [checked]="dataDetail.isStop" [(ngModel)]="dataDetail.isStop" />
              <label class="form-check-label fw-bold" for="isStop">Stopped</label>
            </div>
          </div>
          <div class="col-xl-3 col-md-12">
            <label for="TextInput" class="form-label fw-bold">&nbsp;</label>
            <div class="form-check form-switch">
              <input class="form-check-input" disabled="true" type="checkbox" name="isRestartDocker" role="switch"
                id="isRestartDocker" [checked]="dataDetail.isRestartDocker" [(ngModel)]="dataDetail.isRestartDocker" />
              <label class="form-check-label fw-bold" for="isRestartDocker">Restarted Docker</label>
            </div>
          </div>
          <div class="col-xl-6 col-md-12">
            <label for="TextInput" class="form-label fw-bold">Cron (<span class="text-danger"
                (click)="isEditCron = !isEditCron">Edit Cron</span>)</label>
            <input type="text" class="form-control" name="cron" [(ngModel)]="dataDetail.cron" [disabled]="isEditCron" />
          </div>
          <div class="col-xl-4 col-md-12">
            <label for="TextInput" class="form-label fw-bold">Hour start</label>
            <input type="number" min="0" max="23" placeholder="Enter hour..." class="form-control" name="hour"
              [(ngModel)]="hour" (ngModelChange)="convertCron()" />
          </div>
          <div class="col-xl-4 col-md-12">
            <label for="TextInput" class="form-label fw-bold">Minute start</label>
            <input type="number" min="0" max="60" placeholder="Enter minute..." class="form-control" id="minute"
              name="minute" [(ngModel)]="minute" (ngModelChange)="convertCron()" />
          </div>
          <div class="col-xl-4 col-md-12">
            <label for="TextInput" class="form-label fw-bold">Times</label>
            <input type="number" min="0" max="23" placeholder="Enter times..." class="form-control" name="times"
              [(ngModel)]="times" (ngModelChange)="convertCron()" />
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <div class="text-end mt-5">
      <button class="btn btn-success me-2 lift rounded-2" type="submit">
        <i class="fa fa-save"></i> Update
      </button>
      <button class="btn btn-danger lift rounded-2" type="button" (click)="hideModal()">
        <i class="fa fa-close"></i>
        Cancel
      </button>
    </div>
  </div>
</form>

<div class="modal-header">
  <h4 class="modal-title pull-left">Cart detail</h4>
  <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="hideModal()">
    <span aria-hidden="true" class="visually-hidden">&times;</span>
  </button>
</div>
<div class="modal-body">
  <p-table [value]="dataDetail" [scrollable]="true" scrollHeight="300px" [tableStyle]="{ 'max-width': '50px' }">
    <ng-template pTemplate="header">
      <tr>
        <th>Product ID</th>
        <th>Name</th>
        <th>Image</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Info Browser</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-product>
      <tr>
        <td style="width:5%">{{ product.productId }}</td>
        <td style="width:9%">{{ product.productName }}</td>
        <td>
          <p-image [src]="product.image" alt="Image" width="200"></p-image>
        </td>
        <td>{{ product.price | currency:'USD':'symbol':'1.2-2'}}</td>
        <td>{{ product.quantity }}</td>
        <td style="width:9%">{{ product.infoBrowser }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-default" (click)="hideModal()">bỏ qua</button>
</div>

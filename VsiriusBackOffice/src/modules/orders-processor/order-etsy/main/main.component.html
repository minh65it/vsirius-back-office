<div class="card">
  <div class="card-header d-flex flex-row-reverse">
    <div class="">
      <fieldset class="form-icon-group left-icon position-relative">
        <button type="button" class="btn btn-primary" (click)="submitLink()">Submit new order to Qgold</button>
        <button type="button" class="btn btn-primary" style="margin-left: 5px;" (click)="submitLinkStuller()">Submit new
          order to Stuller</button>
      </fieldset>
    </div>
  </div>

  <div class="card-header d-block">
    <form class="row g-3" (ngSubmit)="search()" autocomplete="off">
      <div class="col-lg-3 col-md-6 col-sm-12">
        <label for="TextInput" class="form-label fw-bold">Order Id</label>
        <fieldset class="">
          <input type="text" [(ngModel)]="etsySearchParam.ids" name="ID" class="form-control"
            placeholder="Order Id..." />
        </fieldset>
      </div>
      <div class="col-lg-3 col-md-6 col-sm-12">
        <label for="TextInput" class="form-label fw-bold">Search</label>
        <fieldset class="">
          <input type="text" [(ngModel)]="etsySearchParam.keySearch" name="keySearch" class="form-control"
            placeholder="Search..." />
        </fieldset>
      </div>
      <div class="col d-flex justify-content-end">
        <label for="TextInput" class="form-label fw-bold">&nbsp;</label>
        <div class="d-flex justify-content-end align-items-end">
          <button type="submit" class="btn btn-success border lift rounded-2">
            <i class="fa fa-search"></i>
            Search
          </button>
          <button type="button" (click)="clean()" class="btn btn-secondary border lift rounded-2">
            <i class="fa fa-refresh"></i>
            Clean
          </button>
        </div>
      </div>
    </form>

    <div class="card-body table-scroll-view">

      <div class="d-flex align-items-center col-lg-6 col-md-6 col-sm-6">
        <p class="font-weight-bold">{{pagination.totalCount}} Results </p>
        &nbsp;
        <ng-select [placeholder]="'page size...'" name="changePagination" (ngModelChange)="filterPagination($event)"
          [(ngModel)]="pagination.pageSize" class="prime-select-option" [clearable]="false">
          <ng-option *ngFor="let item of listChoosePagination" [value]=" item.key">{{
            item.value}}
          </ng-option>
        </ng-select>
      </div>

      <p-table [scrollable]="true" scrollHeight="800px" [columns]="selectedColumns" responsiveLayout="scroll"
        [value]="listEtsyOrder" dataKey="id" [rows]="listEtsyOrder.length">

        <!-- Header -->
        <ng-template pTemplate="header" let-columns>
          <tr>
            <!-- STT -->
            <th class="text-center"> # </th>
            <!-- COLUMNS -->
            <th [pSortableColumn]="item.field" class="text-center" *ngFor="let item of columns">
              <ng-container *ngIf="item.header != 'isDelete'">
                <div class="d-flex justify-content-evenly">
                  <!-- Label -->
                  <span class="text-capitalize">
                    {{item.header}}
                    <!-- Sort -->
                    <p-sortIcon [field]="item.field"></p-sortIcon>
                  </span>
                </div>
              </ng-container>
            </th>
          </tr>
        </ng-template>

        <!-- BODY -->
        <ng-template pTemplate="body" let-item let-columns="columns" let-rowIndex="rowIndex">
          <tr>
            <!-- STT -->
            <td> {{ ((pagination.pageNumber - 1) * pagination.pageSize) + rowIndex + 1 }} </td>
            <!-- DATA -->
            <td *ngFor="let col of columns; index as ii">
              <ng-container *ngIf="col.field == 'receipt_id'">
                <div class="text-info" style="cursor: pointer;" (click)="detail(item)" target="_blank">
                  {{item[col.field]}}
                </div>
              </ng-container>

              <ng-container *ngIf="col.field == 'buyer_user_id'">
                <div class="text-info" style="cursor: pointer;" (click)="detailSupplier(item)" target="_blank">
                  {{item[col.field]}}
                </div>
              </ng-container>

              <ng-container *ngIf="col.field != 'receipt_id' && col.field != 'buyer_user_id' && col.field != 'is_paid' 
                && col.field != 'is_shipped'">
                {{item[col.field]}}
              </ng-container>

              <ng-container *ngIf="col.field == 'is_paid'">{{item[col.field]? 'Yes' : 'No'}}</ng-container>
              <ng-container *ngIf="col.field == 'is_shipped'">{{item[col.field]? 'Yes' : 'No'}}</ng-container>
                
            </td>
          </tr>
        </ng-template>

        <!-- MESSAGE WHEN EMPTY -->
        <ng-template pTemplate="emptymessage" *ngIf="listEtsyOrder.length == 0">
          <tr>
            <td colspan="100%" class="text-center font-weight-bold">
              <span class="text-danger">No Data</span>
            </td>
          </tr>
        </ng-template>

      </p-table>
    </div>
  </div>

  <!-- Pagination -->
  <div class="d-flex justify-content-center" style="margin-bottom: 0.5rem" *ngIf="pagination.totalPage > 1">
    <pagination [boundaryLinks]="true" [totalItems]="pagination.totalCount" [itemsPerPage]="pagination.pageSize"
      previousText="&lsaquo;" [(ngModel)]="pagination.pageNumber" (pageChanged)="pageChanged($event)"
      nextText="&rsaquo;" firstText="&laquo;" lastText="&raquo;" [maxSize]="5">
    </pagination>
  </div>
  
</div>

<div class="modal-header">
  <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="closeModal()">
    <span aria-hidden="true" class="visually-hidden">&times;</span>
  </button>
</div>
<div class="modal-body">
  <form #myForm="ngForm" autocomplete="off">
    <div class="row">
      <div class="col-xl-6 col-md-6 mt-1">
        <label for="TextInput" class="form-label fw-bold">Qgold order ID <span class="text-danger">*</span></label>
        <input type="text" class="form-control" placeholder="Enter ship to phone... " name="orderQgoldId"
          [(ngModel)]="dataSend.orderQgoldId" readonly #orderQgoldId="ngModel" required />
        <div class="text-danger mt-2 d-flex align-items-center"
          *ngIf="orderQgoldId.invalid && (orderQgoldId.touched || orderQgoldId.dirty || checkValidated)">
          <span>*Qgold order ID </span>
        </div>
      </div>
      <div class="col-xl-6 col-md-6 mt-1">
        <label for="TextInput" class="form-label fw-bold">Ship to phone <span class="text-danger">*</span></label>
        <input type="text" class="form-control" placeholder="Enter ship to phone... " name="shipToPhone"
          [(ngModel)]="dataSend.shipToPhone" #shipToPhone="ngModel" required />
        <div class="text-danger mt-2 d-flex align-items-center"
          *ngIf="shipToPhone.invalid && (shipToPhone.touched || shipToPhone.dirty || checkValidated)">
          <span>*Ship to phone </span>
        </div>
      </div>
    </div>
  </form>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-success" (click)="sendMail()">Send mail lost package</button>
  <button type="button" class="btn btn-secondary" (click)="closeModal()">Close</button>
</div>

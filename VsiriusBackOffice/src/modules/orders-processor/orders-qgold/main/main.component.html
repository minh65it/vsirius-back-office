<div class="col-md-12">
  <div class="card">
    <div class="card-header d-flex flex-row-reverse">
      <div class="">
        <fieldset class="form-icon-group left-icon position-relative">
          <button type="button" class="btn btn-primary" (click)="submitLink()">Submit new order</button>
        </fieldset>
      </div>
    </div>
    <div class="card-header d-block">
      <form class="row g-3" (ngSubmit)="search()" autocomplete="off">
        <div class="col-lg-3 col-md-6 col-sm-12">
          <fieldset class="">
            <input type="text" [(ngModel)]="searchQgoldProcessParam.orderQgoldId" name="orderQgoldId"
              class="form-control" placeholder="Order Qgold Id..." />
          </fieldset>
        </div>
        <div class="col-lg-3 col-md-6 col-sm-12">
          <ng-select [placeholder]="'Order Status...'" (ngModelChange)="getOrderStatus($event)"
            [(ngModel)]="searchQgoldProcessParam.orderStatus" name="orderStatus">
            <ng-option *ngFor="let item of orderQgoldStatusOptions" [value]="item.value">{{
              item.key}}</ng-option>
          </ng-select>
        </div>
        <div class="col-lg-3 col-md-6 col-sm-12">
          <fieldset class="form-icon-group left-icon position-relative">
            <input type="text" [(ngModel)]="searchFrom" name="searchFrom" bsDatepicker
              [bsConfig]="{ isAnimated: true, dateInputFormat: 'YYYY-MM-DD' }" class="form-control"
              placeholder="From Date..." />
            <div class="form-icon position-absolute">
              <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
          </fieldset>
        </div>
        <div class="col-lg-3 col-md-6 col-sm-12">
          <fieldset class="form-icon-group left-icon position-relative">
            <input type="text" [(ngModel)]="searchTo" name="searchTo" bsDatepicker
              [bsConfig]="{ isAnimated: true, dateInputFormat: 'YYYY-MM-DD' }" class="form-control"
              placeholder="To Date..." />
            <div class="form-icon position-absolute">
              <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
          </fieldset>
        </div>
        <div class="col-lg-3 col-md-6 col-sm-12">
          <fieldset>
            <input type="text" [(ngModel)]="searchQgoldProcessParam.buyerName" name="BuyerName" class="form-control"
              placeholder="Buyer Name..." />
          </fieldset>
        </div>
        <div class="col-lg-3 col-md-6 col-sm-12">
          <fieldset>
            <input type="text" [(ngModel)]="searchQgoldProcessParam.style" name="style" class="form-control"
              placeholder="Style..." />
          </fieldset>
        </div>
        <div class="col-lg-3 col-md-6 col-sm-12">
          <fieldset>
            <input type="text" [(ngModel)]="searchQgoldProcessParam.marketplace" name="marketplace" class="form-control"
              placeholder="Marketplace..." />
          </fieldset>
        </div>
        <div class="col-lg-3 col-md-6 col-sm-12">
          <fieldset>
            <input type="text" [(ngModel)]="searchQgoldProcessParam.marketOrderId" name="marketOrderId"
              class="form-control" placeholder="MarketOrder Id..." />
          </fieldset>
        </div>
        <div class="col d-flex justify-content-end">
          <button type="submit" class="btn btn-success border lift rounded-2">
            <i class="fa fa-search"></i>
            Search
          </button>
          <button type="button" (click)="clean()" class="btn btn-secondary border lift rounded-2">
            <i class="fa fa-search"></i>
            Clean
          </button>
        </div>
      </form>
      <div class="card-body table-scroll-view">
        <p-table [columns]="selectedColumns" responsiveLayout="scroll" [value]="listQgoldOrder" dataKey="id"
          [rows]="listQgoldOrder.length">

          <!-- Header -->
          <ng-template pTemplate="header" let-columns>
            <tr>
              <th class="text-center"></th>
              <!-- STT -->
              <th class="text-center"> # </th>
              <!-- COLUMNS -->
              <th [pSortableColumn]="item.field" class="text-center" *ngFor="let item of columns">
                <div class="d-flex justify-content-evenly">
                  <!-- Mặc định -->
                  <span>&nbsp;</span>
                  <!-- Label -->
                  <span class="text-capitalize">
                    {{item.header}}
                    <!-- Sort -->
                    <p-sortIcon [field]="item.field"></p-sortIcon>
                  </span>
                  <!-- tất cả trường không có filter -->
                  <span>
                    &nbsp;
                  </span>
                  <!-- Filter by Text -->
                  <p-columnFilter type="text" *ngIf="item.field == 'title' ||  item.field == 'floor_Title' "
                    [field]="item.field" display="menu" [operator]="'or'" [showOperator]="false" [showAddButton]="false"
                    class="p-element float-end">
                    <div class="p-column-filter  p-column-filter-menu">
                      <button type="button" aria-haspopup="true" class="p-column-filter-menu-button p-link"
                        aria-expanded="false">
                        <span class="pi pi-filter-icon pi-filter "></span>
                      </button>
                    </div>
                  </p-columnFilter>
                  <p-columnFilter *ngIf="item.field == 'roomType_Title'" [field]="item.field" [showOperator]="false"
                    matchMode="equals" display="menu">
                    <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                      <ng-template let-option pTemplate="item">
                        <span [class]="'customer-badge status-' + option.value">{{option.label}}</span>
                      </ng-template>
                    </ng-template>
                  </p-columnFilter>
                  <p-columnFilter *ngIf="item.field == 'roomStatus_Title'" [field]="item.field" [showOperator]="false"
                    matchMode="equals" display="menu">
                    <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                      <ng-template let-option pTemplate="item">
                        <span [class]="'customer-badge status-' + option.value">{{option.label}}</span>
                      </ng-template>
                    </ng-template>
                  </p-columnFilter>
                </div>
              </th>
            </tr>
          </ng-template>
          <!-- BODY -->
          <ng-template pTemplate="body" let-item let-columns="columns" let-rowIndex="rowIndex">
            <tr>
              <td class="text-center">
                <button type="button" class="btn btn-link btn-sm text-muted" (click)="detail(item)" tooltip="detail"
                  data-bs-toggle="modal" data-bs-target="#RequestQuoteEdit">
                  <i class="fa fa-info text-info"></i>
                </button>
              </td>
              <!-- STT -->
              <td> {{ ((pagination.pageNumber - 1) * pagination.pageSize) + rowIndex + 1 }} </td>
              <!-- DATA -->
              <td *ngFor="let col of columns" [ngClass]="col.field == 'isActive' ? 'text-center':''">
                <ng-container
                  *ngIf="col.field != 'orderDate' && col.field != 'items'">{{item[col.field]}}</ng-container>
                <ng-container *ngIf="col.field == 'items'">
            <tr class="w-100" *ngFor="let i of item[col.field]">
              <div class="d-flex justify-content-around">
                <div>
                  {{i.style}}
                </div>
                <div style="width: 20px !important;">
                </div>
                <div>
                  {{i.qty}}
                </div>
              </div>
            </tr>
            </ng-container>
            <ng-container *ngIf="col.field == 'orderDate'">{{item[col.field] |
              date:'YYYY-MM-dd'}}</ng-container>
            </td>
            </tr>
          </ng-template>
          <!-- MESSAGE WHEN EMPTY -->
          <ng-template pTemplate="emptymessage" *ngIf="listQgoldOrder.length == 0">
            <tr>
              <td colspan="100%" class="text-center font-weight-bold">
                <span class="text-danger">No Data</span>
              </td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </div>
    <!-- Pagination -->
    <div class="d-flex justify-content-center" style="margin-bottom: 0.5rem" *ngIf="pagination.pageCount > 1">
      <pagination [boundaryLinks]="true" [totalItems]="pagination.totalCount" [itemsPerPage]="pagination.pageSize"
        previousText="&lsaquo;" [(ngModel)]="pagination.pageNumber" (pageChanged)="pageChanged($event)"
        nextText="&rsaquo;" firstText="&laquo;" lastText="&raquo;" [maxSize]="5">
      </pagination>
    </div>
  </div>
</div>

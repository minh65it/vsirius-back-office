<div class="card ">
    <form #myForm="ngForm" autocomplete="off" (ngSubmit)="save()">
      <div class="card-body ">
        <div class="row">
          <div class="row g-3 col-xl-12 col-md-12">
            <div class="col-xl-12 col-md-12 row align-items-center justify-content-evenly">
                <!-- <label class=" text-letter form-label fw-bold">Image</label><br> -->
                <div class="image-input avatar xl rounded-4" style="background-image: url({{image}})">
                  <!-- <div class="avatar-wrapper rounded-circle"></div> -->
                  <div class="file-input">
                    <input type="file" #imageRef class="form-control" (change)="uploadFile($event)" name="file-input"
                      id="file-input6">
                    <label for="file-input6" class="fa fa-pencil shadow"></label>
                  </div>
                </div>
              </div>
            <div class="col-xl-6 col-md-12">
              <label for="TextInput" class="form-label fw-bold">Email <span class="text-danger">*</span></label>
              <input type="text" placeholder="Enter email..." disabled class="form-control" name="email"
                [(ngModel)]="userModel.email" #email="ngModel" required />
              <div class="text-danger mt-2 d-flex align-items-center"
                *ngIf="email.invalid && (email.touched || email.dirty || checkValidated)">
                <span>*Please enter email </span>
              </div>
            </div>
            <div class="col-xl-6 col-md-12">
              <label for="TextInput" class="form-label fw-bold">Password <span class="text-danger">*</span></label>
              <input type="password" placeholder="Enter password..." class="form-control" name="password"
                [(ngModel)]="userModel.password" #password="ngModel" />
             
            </div>
            <div class="col-xl-6 col-md-12">
              <label for="TextInput" class="form-label fw-bold">Phone Number</label>
              <input type="text" placeholder="Enter phone number..." class="form-control" name="phoneNumber"
                [(ngModel)]="userModel.phoneNumber" maxlength="10" onkeypress="return /[0-9]/i.test(event.key)" onpaste="return false;" #phoneNumber="ngModel" />
             
            </div>
            <div class="col-xl-6 col-md-12">
              <label for="TextInput" class="form-label fw-bold">Address 1</label>
              <input type="text" placeholder="Enter Address..." class="form-control" name="address1"
                [(ngModel)]="userModel.address1"  />
            </div>
            <div class="col-xl-6 col-md-12">
              <label for="TextInput" class="form-label fw-bold">Address 2</label>
              <input type="text" placeholder="Enter Address..." class="form-control" name="address2"
                [(ngModel)]="userModel.address2"  />
            </div>
            <div class="col-xl-6 col-md-12">
              <label for="TextInput" class="form-label fw-bold">FullName</label>
              <input type="text" placeholder="Enter FullName..." class="form-control" name="fullName"
                [(ngModel)]="userModel.fullName"  />
            </div>
            <div class="col-xl-6 col-md-12">
              <label for="TextInput" class="form-label fw-bold">City</label>
              <input type="text" placeholder="Enter city..." class="form-control" name="city"
                [(ngModel)]="userModel.city"  />
            </div>
            <div class="col-xl-6 col-md-12">
              <label for="TextInput" class="form-label fw-bold">State</label>
              <input type="text" placeholder="Enter state..." class="form-control" name="state"
                [(ngModel)]="userModel.state"  />
            </div>
            <div class="col-xl-6 col-md-12">
              <label for="TextInput" class="form-label fw-bold">PostCode</label>
              <input type="text" placeholder="Enter postCode..." class="form-control" name="postCode"
                [(ngModel)]="userModel.postCode"  />
            </div>
            <div class="col-xl-6 col-md-12">
              <label for="TextInput" class="form-label fw-bold">Country</label>
              <input type="text" placeholder="Enter country..." class="form-control" name="country"
                [(ngModel)]="userModel.country"  />
            </div>
            <div class=" col-md-12">
              <div class="form-check form-switch mt-2">
                <input class="form-check-input" type="checkbox" name="isActive" role="switch" id="isActive"
                  [checked]="userModel.isActive" [(ngModel)]="userModel.isActive" />
                <label class="form-check-label fw-bold" for="isActive">Is Active</label>
              </div>
            </div>
          </div>
        </div>
        <div class="card-footer text-end mt-5">
          <button class="btn btn-secondary me-2 lift rounded-2" type="button" (click)="clearForm()">
            <i class="fa fa-repeat" aria-hidden="true"></i>
            Reset
          </button>
          <button class="btn btn-success me-2 lift rounded-2" type="submit">
            <i class="fa fa-save"></i> Save
          </button>
          <button class="btn btn-danger lift rounded-2" type="button" (click)="cancel()">
            <i class="fa fa-close"></i>
            Cancel
          </button>
        </div>
      </div>
    </form>
  </div>

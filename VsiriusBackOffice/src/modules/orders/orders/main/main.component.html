<div class="col-md-12">
    <div class="card">
        <div class="card-header d-block">
            <form class="row g-3" (ngSubmit)="search()" autocomplete="off">
                <div class="col-12">
                    <button class="btn btn-primary float-end lift me-2 rounded-2" (click)="goToOrderStatus()" type="button">
                        <i class="fa fa-arrow-right"></i>
                        Order Status
                      </button>
                </div>
                <div class="col-lg-3 col-md-3 col-sm-6">
                    <fieldset class="form-icon-group left-icon position-relative">
                        <input type="text" [(ngModel)]="searchFrom" name="searchFrom" bsDatepicker
                            [bsConfig]="{ isAnimated: true, dateInputFormat: 'DD/MM/YYYY' }" class="form-control"
                            placeholder="Choose time from" />
                        <div class="form-icon position-absolute">
                            <i class="fa fa-calendar" aria-hidden="true"></i>
                        </div>
                    </fieldset>
                </div>
                <div class="col-lg-3 col-md-3 col-sm-6">
                    <fieldset class="form-icon-group left-icon position-relative">
                        <input type="text" [(ngModel)]="searchTo" name="searchTo" bsDatepicker
                            [bsConfig]="{ isAnimated: true, dateInputFormat: 'DD/MM/YYYY' }" class="form-control"
                            placeholder="Choose time to" />
                        <div class="form-icon position-absolute">
                            <i class="fa fa-calendar" aria-hidden="true"></i>
                        </div>
                    </fieldset>
                </div>
                <div class="col-lg-12 col-md-12 col-sm-12">
                    <div class="input-group">
                        <input class="form-control rounded" type="text" [(ngModel)]="keyword" autocomplete="off"
                            name="keyword" placeholder="Enter search keywords...." />
                        <button type="submit" class="btn btn-secondary me-2 ms-2 border lift rounded-2">
                            <i class="fa fa-search"></i>
                            Search
                        </button>
                       
                    </div>
                </div>
            </form>
            <div class="card-body table-scroll-view">
                <p-table [columns]="selectedColumns" responsiveLayout="scroll" [value]="listVsiriusOrder" dataKey="id"
                    [rows]="listVsiriusOrder.length">

                    <!-- Header -->
                    <ng-template pTemplate="header" let-columns>
                        <tr>
                            <th class="text-center"></th>
                            <!-- STT -->
                            <th class="text-center"> # </th>
                            <!-- COLUMNS -->
                            <th [pSortableColumn]="item.field" class="text-center" *ngFor="let item of columns">
                                <div class="d-flex justify-content-evenly">
                                    <!-- Mặc định -->
                                    <span>&nbsp;</span>
                                    <!-- Label -->
                                    <span class="text-capitalize">
                                        {{item.header}}
                                        <!-- Sort -->
                                        <p-sortIcon [field]="item.field"></p-sortIcon>
                                    </span>
                                    <!-- tất cả trường không có filter -->
                                    <span>
                                        &nbsp;
                                    </span>
                                    <!-- Filter by Text -->
                                    <p-columnFilter type="text"
                                        *ngIf="item.field == 'title' ||  item.field == 'floor_Title' "
                                        [field]="item.field" display="menu" [operator]="'or'" [showOperator]="false"
                                        [showAddButton]="false" class="p-element float-end">
                                        <div class="p-column-filter  p-column-filter-menu">
                                            <button type="button" aria-haspopup="true"
                                                class="p-column-filter-menu-button p-link" aria-expanded="false">
                                                <span class="pi pi-filter-icon pi-filter "></span>
                                            </button>
                                        </div>
                                    </p-columnFilter>
                                    <p-columnFilter *ngIf="item.field == 'roomType_Title'" [field]="item.field"
                                        [showOperator]="false" matchMode="equals" display="menu">
                                        <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                                            <ng-template let-option pTemplate="item">
                                                <span
                                                    [class]="'customer-badge status-' + option.value">{{option.label}}</span>
                                            </ng-template>
                                        </ng-template>
                                    </p-columnFilter>
                                    <p-columnFilter *ngIf="item.field == 'roomStatus_Title'" [field]="item.field"
                                        [showOperator]="false" matchMode="equals" display="menu">
                                        <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                                            <ng-template let-option pTemplate="item">
                                                <span
                                                    [class]="'customer-badge status-' + option.value">{{option.label}}</span>
                                            </ng-template>
                                        </ng-template>
                                    </p-columnFilter>
                                </div>
                            </th>
                        </tr>
                    </ng-template>
                    <!-- BODY -->
                    <ng-template pTemplate="body" let-item let-columns="columns" let-rowIndex="rowIndex">
                        <tr>
                            <td class="text-center">
                                <button type="button" class="btn btn-link btn-sm text-muted" (click)="update(item)"
                                    tooltip="Sửa" data-bs-toggle="modal" data-bs-target="#RequestQuoteEdit">
                                    <i class="fa fa-pencil text-warning"></i>
                                </button>
                            </td>
                            <!-- STT -->
                            <td> {{ ((pagination.pageNumber - 1) * pagination.pageSize) + rowIndex + 1 }} </td>
                            <!-- DATA -->
                            <td *ngFor="let col of columns" [ngClass]="col.field == 'isActive' ? 'text-center':''">
                                <ng-container
                                    *ngIf="col.field != 'birthDay' && col.field != 'createOrderDate'">{{item[col.field]}}</ng-container>
                                <ng-container *ngIf="col.field == 'birthDay'">{{item[col.field] | date}}</ng-container>
                                <ng-container *ngIf="col.field == 'createOrderDate'">{{item[col.field] |
                                    date:'dd-MM-YYYY'}}</ng-container>
                            </td>
                        </tr>
                    </ng-template>
                    <!-- MESSAGE WHEN EMPTY -->
                    <ng-template pTemplate="emptymessage" *ngIf="listVsiriusOrder.length == 0">
                        <tr>
                            <td colspan="100%" class="text-center font-weight-bold">
                                <span class="text-danger">No Data</span>
                            </td>
                        </tr>
                    </ng-template>
                </p-table>
            </div>
        </div>
        <!-- Pagination -->
        <div class="d-flex justify-content-center" style="margin-bottom: 0.5rem" *ngIf="pagination.totalPage > 1">
            <pagination [boundaryLinks]="true" [totalItems]="pagination.totalCount" [itemsPerPage]="pagination.pageSize"
                previousText="&lsaquo;" [(ngModel)]="pagination.pageNumber" (pageChanged)="pageChanged($event)"
                nextText="&rsaquo;" firstText="&laquo;" lastText="&raquo;" [maxSize]="5">
            </pagination>
        </div>
    </div>
</div>


<div bsModal #modalEdit="bs-modal" class="modal fade" tabindex="-1" [config]="{backdrop: 'static'}" role="dialog"
    aria-labelledby="dialog-sizes-name1">
    <form class="modal-dialog modal-xl modal-dialog-scrollable" #myForm="ngForm" autocomplete="off" (ngSubmit)="save()">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-uppercase fw-bold">Update Order</h5>
                <button type="button" class="btn-close" (click)="modalEdit.hide()" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row mb-3">
                    <div class="col-4 mb-2">
                        <label for="TextInput" class="form-label fw-bold label-custom">FirstName</label>
                        <input type="text" class="form-control" name="firstName" [(ngModel)]="modelEdit.firstName" />
                    </div>
                    <div class="col-4 mb-2">
                        <label for="TextInput" class="form-label fw-bold label-custom">Last Name</label>
                        <input type="text" class="form-control" name="lastName" [(ngModel)]="modelEdit.lastName" />
                    </div>
                    <div class="col-4 mb-2">
                        <label for="TextInput" class="form-label fw-bold label-custom">Email</label>
                        <input type="text" class="form-control" name="email" [(ngModel)]="modelEdit.email" />
                    </div>
                    <div class="col-4 mb-2">
                        <label for="TextInput" class="form-label fw-bold label-custom">BirthDay</label>
                        <input type="text" class="form-control" bsDatepicker
                        [bsConfig]="{ isAnimated: true, dateInputFormat: 'DD/MM/YYYY' }" name="birthDay" [(ngModel)]="birthDay" />
                    </div>
                    <div class="col-4 mb-2">
                        <label for="TextInput" class="form-label fw-bold label-custom">Address1</label>
                        <input type="text" class="form-control" name="address1" [(ngModel)]="modelEdit.address1" />
                    </div>
                    <div class="col-4 mb-2">
                        <label for="TextInput" class="form-label fw-bold label-custom">Address2</label>
                        <input type="text" class="form-control" name="address2" [(ngModel)]="modelEdit.address2" />
                    </div>
                    <div class="col-4 mb-2">
                        <label for="TextInput" class="form-label fw-bold label-custom">City</label>
                        <input type="text" class="form-control" name="city" [(ngModel)]="modelEdit.city" />
                    </div>
                    <div class="col-4 mb-2">
                        <label for="TextInput" class="form-label fw-bold label-custom">State</label>
                        <input type="text" class="form-control" name="state" [(ngModel)]="modelEdit.state" />
                    </div>
                    <div class="col-4 mb-2">
                        <label for="TextInput" class="form-label fw-bold label-custom">PostCode</label>
                        <input type="text" class="form-control" name="postCode" [(ngModel)]="modelEdit.postCode" />
                    </div>
                    <div class="col-4 mb-2">
                        <label for="TextInput" class="form-label fw-bold label-custom">Country</label>
                        <input type="text" class="form-control" name="country" [(ngModel)]="modelEdit.country" />
                    </div>
                    <div class="col-4 mb-2">
                        <label for="TextInput" class="form-label fw-bold label-custom">Note</label>
                        <input type="text" class="form-control" name="note" [(ngModel)]="modelEdit.note" />
                    </div>
                    <div class="col-4 mb-2">
                        <label for="TextInput" class="form-label fw-bold label-custom">Create Order Date</label>
                        <input type="text" class="form-control" bsDatepicker
                        [bsConfig]="{ isAnimated: true, dateInputFormat: 'DD/MM/YYYY' }" name="createOrderDate" [(ngModel)]="createOrderDate" />
                    </div>
                    <div class="col-4 mb-2">
                        <label for="TextInput" class="form-label fw-bold label-custom">Total Quantity </label>
                        <input type="number" class="form-control" name="totalQuantityItem" [(ngModel)]="modelEdit.totalQuantityItem" />
                    </div>
                    <div class="col-8">
                        <label for="TextInput" class="form-label fw-bold label-custom">Order Status </label>
                        <div class="d-flex justify-content-evenly mt-2">
                            <div class="flex align-items-center" *ngFor="let item of listOrderStatus,let i = index">
                                <p-radioButton [name]="item.key" [value]="item" [(ngModel)]="chooseValueStatus"
                                    [inputId]="item.key + i"></p-radioButton>
                                <label [for]="item.key + i" class="ms-2">{{item.value}}</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-success me-2 lift rounded-2" type="submit">
                    <i class="fa fa-save"></i> Save
                </button>
            </div>
        </div>
    </form>
</div>

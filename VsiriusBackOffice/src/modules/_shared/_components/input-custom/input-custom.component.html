  <label for="TextInput" class="form-label fw-bold">{{label}} <span *ngIf="isValidate" class="text-danger">*</span></label>
  <input type="text" [placeholder]="'Enter field ' + label + '...'" class="form-control" [name]="model"
    [(ngModel)]="model" (input)="onInputChange($event)" [required]="isValidate" />

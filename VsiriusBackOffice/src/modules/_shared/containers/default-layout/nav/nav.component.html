<div class="layout-1" data-luno="theme-blue">
  <div class="sidebar p-2 py-md-3">

    <div class="container-fluid">
      <div class="title-text d-flex align-items-center mb-4 mt-1">
        <h4 class="sidebar-title mb-0 flex-grow-1">
          <!-- <span class="sm-txt">V</span><span>Sirius Back Office</span> -->
        </h4>
        <div class="img">
          <img class="w-50 ms-5" src="assets/images/VSIRIUS_Logo_Final_228x136.png" alt="VSIRIUS_Logo_Final">
        </div>
      </div>

      <div class="main-menu flex-grow-1">
        <ul class="menu-list">
          <li class="collapsed">
            <a class="m-link" href="/">
              <i class="fa fa-home"></i>
              <span class="ms-2">Home</span>
            </a>
          </li>
          <ng-container>
            <!-- Menu level 0 -->
            <li class="collapsed" *ngIf="menu.Admin || menu.Product">
              <a class="m-link cursor-pointer" [routerLink]="'/products/product'" routerLinkActive="active">
                <i class="fa fa-product-hunt"></i>
                <span class="ms-2">Product</span>
              </a>
            </li>
            <li class="collapsed" *ngIf="menu.Admin || menu.Product">
              <a class="m-link cursor-pointer" [routerLink]="'/products/filter'" routerLinkActive="active">
                <i class="fa fa-bars"></i>
                <span class="ms-2">Filter</span>
              </a>
            </li>
            <li class="collapsed" *ngIf="menu.Admin || menu.User">
              <a class="m-link cursor-pointer" [routerLink]="'/users'" routerLinkActive="active">
                <i class="fa fa-users"></i>
                <span class="ms-2">Users</span>
              </a>
            </li>
            <li class="collapsed" *ngIf="menu.Admin || menu.Employee">
              <a class="m-link cursor-pointer" [routerLink]="'/employees'" routerLinkActive="active">
                <i class="fa fa-user"></i>
                <span class="ms-2">Employees</span>
              </a>
            </li>

            <!-- <li class="collapsed" > -->
            <li class="collapsed" style="cursor: pointer;" *ngIf="menu.Admin || menu.Order">
              <a (click)="toggleCollapse('order-processor')" data-bs-toggle="collapsed" class="m-link cursor-pointer"
                routerLinkActive="active">
                <i class="fa fa-shopping-cart"></i>
                <span class="ms-2">Orders</span>
                <span class="arrow fa  ms-auto text-end"
                  [ngClass]="visible  ? 'fa-angle-right' : 'fa-angle-down'"></span>
              </a>
              <ul class="sub-menu" [ngClass]="visible  ? 'collapsed' : 'collapse'">
                <li class="collapsed" *ngFor="let child of listOrder">
                  <a class="m-link cursor-pointer" [routerLink]="''+ child.url" routerLinkActive="active">
                    <i class="fa fa-minus"></i>
                    <span class="ms-2 " style="cursor: pointer;">{{child.title}}</span>
                  </a>
                </li>
              </ul>
            </li>

            <li class="collapsed" *ngIf="menu.Admin || menu.DrivenHTML">
              <a class="m-link cursor-pointer" [routerLink]="'/contacts'" routerLinkActive="active">
                <i class="fa fa-envelope"></i>
                <span class="ms-2">Contacts</span>
              </a>
            </li>
            <li class="collapsed" *ngIf="menu.Admin || menu.Cart">
              <a class="m-link cursor-pointer" [routerLink]="'/cart'" routerLinkActive="active">
                <i class="fa fa-shopping-cart"></i>
                <span class="ms-2">Cart</span>
              </a>
            </li>
            <li class="collapsed" *ngIf="menu.Admin || menu.System">
              <a class="m-link cursor-pointer" [routerLink]="'/system-logging'" routerLinkActive="active">
                <i class="fa fa-gear"></i>
                <span class="ms-2">System Logging</span>
              </a>
            </li>
            <li class="collapsed" *ngIf="menu.Admin || menu.Notification">
              <a class="m-link cursor-pointer" [routerLink]="'/notifications'" routerLinkActive="active">
                <i class="fa fa-bell"></i>
                <span class="ms-2">Notifications</span>
              </a>
            </li>
            <li class="collapsed" *ngIf="menu.Admin || menu.DrivenHTML">
              <a class="m-link cursor-pointer" [routerLink]="'/drivenHtmlPagess'" routerLinkActive="active">
                <i class="fa fa-columns"></i>
                <span class="ms-2">Driven Html Pages</span>
              </a>
            </li>
            <li class="collapsed" *ngIf="menu.Admin || menu.QAQgold">
              <a class="m-link cursor-pointer" [routerLink]="'/qa-qgold'" routerLinkActive="active">
                <i class="fa fa-question"></i>
                <span class="ms-2">Q&A Qgold</span>
              </a>
            </li>
          </ng-container>
        </ul>

      </div>

  </ul> -->

  <div class="wrapper">
    <app-header></app-header>

    <div class="page-toolbar px-xl-4 px-sm-2 px-3 py-4">

        <div class="align-items-center">

<div class="card ">
  <div class="card-header d-flex flex-row-reverse">
    <div class="col d-flex justify-content-end">
      <button type="button" (click)="back()" class="btn btn-sm btn-secondary border lift rounded-2">
        <i class="fa fa-arrow-left"></i>
        Back
      </button>
    </div>
  </div>
  <div class="card-body">
    <div class="row">
      <h4 class="text-info mt-2">Package claim</h4>
      <div class="col-xl-6 col-md-6 mt-2">
        <label class="form-label fw-bold">Document Type </label>
        <div class="form-control" style="height: 35px;">
          {{claimDto?.documentType}}
        </div>
      </div>
      <div class="col-xl-6 col-md-6 mt-2">
        <label class="form-label fw-bold">Scan Date </label>
        <div class="form-control" style="height: 35px;">
          {{claimDto?.scanDate | date:'YYYY-MM-dd'}}
        </div>
      </div>
      <ng-container class="col-xl-12 col-md-12 mt-2" *ngIf="claimDto?.notes?.length > 0">
        <label class="form-label fw-bold">Notes </label>
        <div class="form-control" [style.height.px]="50 * claimDto?.notes?.length">
          <div class="form mt-1" *ngFor="let item of claimDto?.notes; index as i">
            Note {{i + 1}}: {{item}}
          </div>
        </div>
      </ng-container>
      <ng-container *ngFor="let item of claimDto?.images">
        <div class="card mt-2" style="width: 18rem;">
          <img [src]="item?.url" class="card-img-top" alt="..." (click)="openModal(template, item?.url)">
          <div class="card-body">
            <p class="card-text">{{item?.text}}</p>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</div>

<ng-template #template>
  <div class="modal-header">
    <button type="button" class="btn-close close pull-right" aria-label="Close" (click)="modalRef?.hide()">
      <span aria-hidden="true" class="visually-hidden">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <img [src]="modalRef?.content" class="card-img-top" [alt]="modalRef?.content">
  </div>
</ng-template>

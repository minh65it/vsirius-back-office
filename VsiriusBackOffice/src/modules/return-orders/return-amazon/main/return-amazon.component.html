<div class="card">
  <div class="card-header d-block">
    <form class="row g-3" (ngSubmit)="search()" autocomplete="off">
      <div class="col-lg-3 col-md-6 col-sm-12">
        <label for="TextInput" class="form-label fw-bold">Order ID</label>
        <fieldset class="">
          <input type="text" [(ngModel)]="returnAmazonSearchParam.orderID" name="orderID" class="form-control"
            placeholder="Order ID..." />
        </fieldset>
      </div>
      <div class="col-lg-3 col-md-6 col-sm-12">
        <label for="TextInput" class="form-label fw-bold">Tracking ID</label>
        <fieldset class="">
          <input type="text" [(ngModel)]="returnAmazonSearchParam.trackingID" name="trackingID" class="form-control"
            placeholder="Tracking ID..." />
        </fieldset>
      </div>
      <div class="col-lg-3 col-md-6 col-sm-12">
        <label for="TextInput" class="form-label fw-bold">Item Name</label>
        <fieldset class="">
          <input type="text" [(ngModel)]="returnAmazonSearchParam.itemName" name="itemName" class="form-control"
            placeholder="Item Name..." />
        </fieldset>
      </div>
      <div class="col-lg-3 col-md-6 col-sm-12">
        <label for="TextInput" class="form-label fw-bold">Return Request Status</label>
        <ng-select [placeholder]="'Return Request Status...'" (ngModelChange)="getReturnOrderStatus($event)"
          [(ngModel)]="returnAmazonSearchParam.returnRequestStatus" name="returnRequestStatus" [clearable]="false">
          <ng-option *ngFor="let item of listReturnRequestStatus" [value]="item.value">{{
            item.key}}</ng-option>
        </ng-select>
      </div>
      <div class="col-lg-3 col-md-6 col-sm-12">
        <label for="TextInput" class="form-label fw-bold">From Order Date</label>
        <fieldset class="form-icon-group left-icon position-relative">
          <input type="text" [(ngModel)]="searchOrderFrom" name="searchOrderFrom" bsDatepicker
            [bsConfig]="{ isAnimated: true, dateInputFormat: 'YYYY-MM-DD' }" class="form-control"
            placeholder="From Order Date..." />
          <div class="form-icon position-absolute">
            <i class="fa fa-calendar" aria-hidden="true"></i>
          </div>
        </fieldset>
      </div>
      <div class="col-lg-3 col-md-6 col-sm-12">
        <label for="TextInput" class="form-label fw-bold">To Order Date</label>
        <fieldset class="form-icon-group left-icon position-relative">
          <input type="text" [(ngModel)]="searchOrderTo" name="searchOrderTo" bsDatepicker
            [bsConfig]="{ isAnimated: true, dateInputFormat: 'YYYY-MM-DD' }" class="form-control"
            placeholder="To Order Date..." />
          <div class="form-icon position-absolute">
            <i class="fa fa-calendar" aria-hidden="true"></i>
          </div>
        </fieldset>
      </div>
      <div class="col-lg-3 col-md-6 col-sm-12">
        <label for="TextInput" class="form-label fw-bold">Return Request Date From</label>
        <fieldset class="form-icon-group left-icon position-relative">
          <input type="text" [(ngModel)]="searchReturnRequestDateFrom" name="searchReturnRequestDateFrom" bsDatepicker
            [bsConfig]="{ isAnimated: true, dateInputFormat: 'YYYY-MM-DD' }" class="form-control"
            placeholder="Return Request Date From..." />
          <div class="form-icon position-absolute">
            <i class="fa fa-calendar" aria-hidden="true"></i>
          </div>
        </fieldset>
      </div>
      <div class="col-lg-3 col-md-6 col-sm-12">
        <label for="TextInput" class="form-label fw-bold">Return Request Date To</label>
        <fieldset class="form-icon-group left-icon position-relative">
          <input type="text" [(ngModel)]="searchReturnRequestDateTo" name="searchReturnRequestDateTo" bsDatepicker
            [bsConfig]="{ isAnimated: true, dateInputFormat: 'YYYY-MM-DD' }" class="form-control"
            placeholder="Return Request Date To..." />
          <div class="form-icon position-absolute">
            <i class="fa fa-calendar" aria-hidden="true"></i>
          </div>
        </fieldset>
      </div>
      <div class="col-lg-3 col-md-6 col-sm-12">
        <label for="TextInput" class="form-label fw-bold">Amazon RMA ID</label>
        <fieldset class="">
          <input type="text" [(ngModel)]="returnAmazonSearchParam.amazonRMAID" name="amazonRMAID" class="form-control"
            placeholder="Amazon RMA ID..." />
        </fieldset>
      </div>
      <div class="col-lg-12 col-md-12 col-sm-12">
        <label for="TextInput" class="form-label fw-bold"><br></label>
        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-success border lift rounded-2">
            <i class="fa fa-search"></i>
            Search
          </button>
          <button type="button" (click)="clean()" class="btn btn-secondary border lift rounded-2">
            <i class="fa fa-refresh"></i>
            Clean
          </button>
        </div>
      </div>
    </form>
    <div class="card-body table-scroll-view">
      <div class="d-flex align-items-center col-lg-6 col-md-6 col-sm-6">
        <p class="font-weight-bold">{{pagination?.totalCount}} Results </p>
        &nbsp;
        <ng-select [placeholder]="'page size...'" name="changePagination" (ngModelChange)="filterPagination($event)"
          [(ngModel)]="pagination.pageSize" class="prime-select-option" [clearable]="false">
          <ng-option *ngFor="let item of listChoosePagination" [value]=" item.key">{{
            item.value}}</ng-option>
        </ng-select>
      </div>
      <p-table [scrollable]="true" scrollHeight="800px" [columns]="selectedColumns" responsiveLayout="scroll"
        [value]="listReturnAmazonOrder" dataKey="id" [rows]="listReturnAmazonOrder.length">
        <!-- Header -->
        <ng-template pTemplate="header" let-columns>
          <tr>
            <!-- STT -->
            <th class="text-center"> # </th>
            <!-- COLUMNS -->
            <th [pSortableColumn]="item.field" [pSortableColumnDisabled]="item.field === 'isDelete'" class="text-center"
              *ngFor="let item of columns">
              <ng-container *ngIf="item.header != 'isDelete'">
                <div class="d-flex justify-content-evenly">
                  <!-- Label -->
                  <span class="text-capitalize">
                    {{item.header}}
                    <!-- Sort -->
                    <p-sortIcon [field]="item.field"></p-sortIcon>
                  </span>
                </div>
              </ng-container>
              <ng-container *ngIf="item.header == 'isDelete'">
                <!-- <div class="text-center">
                  <button type="button" (click)="deleteAll()" class="btn btn-sm btn-danger border lift rounded-2">
                    <i class="fa fa-trash"></i>
                    Delete All
                  </button>
                  <div class="custom-control custom-checkbox checkAll">
                    <input type="checkbox" class="custom-control-input" id="isCheckAll" [(ngModel)]="isCheckAll"
                      (change)="checkAll()">
                    <label class="custom-control-label" for="isCheckAll"></label>
                  </div>
                </div> -->
              </ng-container>
            </th>
          </tr>
        </ng-template>
        <!-- BODY -->
        <ng-template pTemplate="body" let-item let-columns="columns" let-rowIndex="rowIndex">
          <tr>
            <!-- STT -->
            <td> {{ ((pagination.pageNumber - 1) * pagination.pageSize) + rowIndex + 1 }} </td>
            <!-- DATA -->
            <td *ngFor="let col of columns; index as ii">
              <ng-container *ngIf="col.field == 'orderID'">
                <div class="text-info" style="cursor: pointer;" (click)="detailOrder(item[col.field])" target="_blank">
                  {{item[col.field]}}
                </div>
              </ng-container>
              <ng-container *ngIf="col.field == 'amazonRMAID'">
                <div class="text-info" style="cursor: pointer;" (click)="detailReturnOrder(item)" target="_blank">
                  {{item[col.field]}}
                </div>
              </ng-container>
              <ng-container *ngIf="col.field != 'orderID' && col.field != 'amazonRMAID' && col.field != 'returnRequestDate'
                && col.field != 'isDelete' && col.field != 'orderDate'">
                {{item[col.field]}}
              </ng-container>

              <ng-container *ngIf="col.field == 'orderDate' || col.field == 'returnRequestDate'">{{item[col.field] |
                date:'YYYY-MM-dd'}}</ng-container>
            </td>
          </tr>
        </ng-template>
        <!-- MESSAGE WHEN EMPTY -->
        <ng-template pTemplate="emptymessage" *ngIf="listReturnAmazonOrder.length == 0">
          <tr>
            <td colspan="100%" class="text-center font-weight-bold">
              <span class="text-danger">No Data</span>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
  <!-- Pagination -->
  <div class="d-flex justify-content-center" style="margin-bottom: 0.5rem" *ngIf="pagination.pageCount > 1">
    <pagination [boundaryLinks]="true" [totalItems]="pagination.totalCount" [itemsPerPage]="pagination.pageSize"
      previousText="&lsaquo;" [(ngModel)]="pagination.pageNumber" (pageChanged)="pageChanged($event)"
      nextText="&rsaquo;" firstText="&laquo;" lastText="&raquo;" [maxSize]="5">
    </pagination>
  </div>
</div>

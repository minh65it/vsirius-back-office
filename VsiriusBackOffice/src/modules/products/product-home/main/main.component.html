<div class="col-md-12">
  <div class="card">
    <div class="card-header d-block">
      <div class="card-body table-scroll-view">
        <p-table [value]="listProductsHome" responsiveLayout="scroll" dataKey="id" [rows]="listProductsHome.length">
          <ng-template pTemplate="header">
            <tr>
              <th class="text-center">
                #
              </th>
              <th class="text-center">
                Item Sku
              </th>
              <th class="text-center">
                Item Name
              </th>
              <th class="text-center">
                IsPopular
              </th>
              <th class="text-center">
                IsLatest
              </th>
              <th class="text-center"></th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-home let-rowIndex="rowIndex">
            <tr>
              <td>{{ rowIndex + 1 }}</td>
              <td>{{ home.item_sku }}</td>
              <td>{{ home.item_name }}</td>
              <td class="text-center">
                <input class="form-check-input" type="checkbox" role="switch"
                  [checked]="home.isPopular" [name]="home.isPopular + rowIndex + 1" (click)="update(home,1)"  />
              </td>
              <td class="text-center">
                <input class="form-check-input" type="checkbox" role="switch"
                  [checked]="home.isLatest" [name]="home.isLatest + rowIndex + 1" (click)="update(home,2)" />
              </td>
              <td>
                <button type="button" class="btn btn-link btn-sm text-muted" tooltip="Xóa" (click)="delete(home)">
                  <i class="fa fa-trash text-danger"></i>
                </button>
              </td>
            </tr>
          </ng-template>
          <ng-template pTemplate="emptymessage" *ngIf="listProductsHome?.length === 0" let-customer
            let-rowIndex="rowIndex">
            <tr>
              <td colspan="100%" class="text-center font-weight-bold">
                <span class="text-danger">No Data</span>
              </td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </div>
  </div>
</div>

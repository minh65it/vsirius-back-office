<div class="col-md-12">
  <div class="card">
    <div class="card-header d-block">
      <form class="row g-3" (ngSubmit)="search()">
        <div class="col-lg-6 col-md-6 col-sm-12">
          <ng-select [placeholder]="'feed_product_type...'" [clearable]="productType == null" id="feed_product_type"
            name="feed_product_type" (ngModelChange)="filterProductType($event)" [(ngModel)]="productType">
            <ng-option *ngFor="let item of listProductType.toString().split(',')" [value]="item">{{
              item}}</ng-option>
          </ng-select>
        </div>
        <div class="col-lg-6 col-md-6 col-sm-12">
          <ng-select [placeholder]="'item_type...'" [disabled]="isShowSelect" [multiple]="true" id="item_type"
            (ngModelChange)="filterItemType($event)" [(ngModel)]="item_type" name="item_type">
            <ng-option *ngFor="let item of listItemType.toString().split(',')" [value]="item">{{
              item}}</ng-option>
          </ng-select>
        </div>
        <div class="col-lg-6 col-md-6 col-sm-12">
          <ng-select [placeholder]="'metal_type...'" name="metal_type" [disabled]="isShowSelect" [multiple]="true"
            id="metal_type" (ngModelChange)="filterMetalType($event)" [(ngModel)]="metal_type">
            <ng-option *ngFor="let item of listMetalType.toString().split(',')" [value]="item">{{
              item}}</ng-option>
          </ng-select>
        </div>
        <div class="col-lg-6 col-md-6 col-sm-12">
          <div class="row">
            <div class="col">
              <input class="form-control rounded" type="number" [(ngModel)]="searchParams.minPrice" min="0"
                autocomplete="off" id="minPrice" name="minPrice" placeholder="Min Price...." />
            </div>
            <div class="col">
              <input class="form-control rounded" type="number" [(ngModel)]="searchParams.maxPrice" min="1"
                autocomplete="off" id="maxPrice" name="maxPrice" placeholder="Max Price...." />
            </div>
            <div class="col d-flex justify-content-start align-items-center">
              <div class="form-check mt-0 ml-0 mb-0">
                <input class="form-check-input" type="checkbox" [(ngModel)]="searchParams.includeNoStock" id="includeNoStock"
                  name="includeNoStock">
                <label class="form-check-label" for="includeNoStock">
                  Include No Stock
                </label>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-12 col-md-12 col-sm-12">
          <div class="input-group">
            <input class="form-control rounded" type="text" [(ngModel)]="searchParams.keyword" autocomplete="off"
              name="keyword" id="keyword" placeholder="Enter search keywords...." />
            <button type="submit" class="btn btn-secondary me-2 ms-2 border lift rounded-2">
              <i class="fa fa-search"></i>
              Search
            </button>
            <button class="btn btn-primary lift me-2 rounded-2" (click)="goToAdd()" type="button">
              <i class="fa fa-plus"></i>
              Add new
            </button>
            <button class="btn btn-success lift me-2 rounded-2" type="button" (click)="fileInput.click()">
              <i class="fa fa-upload"></i>
              Import file
            </button>
            <input #fileInput type="file" style="display: none;" (change)="onFileSelected($event)">
            <button class="btn btn-info lift me-2 rounded-2" (click)="goToProductHome()" type="button">
              <i class="fa fa-arrow-right"></i>
              Home product
            </button>
            <button class="btn btn-secondary lift me-2 rounded-2" (click)="clean()" type="button">
              <i class="fa fa-refresh"></i>
              Clean
            </button>
          </div>
        </div>

      </form>
      <div class="card-body table-scroll-view">
        <p-table [columns]="selectedColumns" responsiveLayout="scroll" [value]="listProducts" dataKey="id"
          [rows]="listProducts.length">
          <!-- Thanh Chọn Cột -->
          <ng-template pTemplate="caption">
            <div class="flex">
              <p-multiSelect [options]="cols" [(ngModel)]="selectedColumns" (click)="removeFilterSearch($event)"
                (onChange)="onChangeFilterSearch($event)" optionLabel="header" class="chooseColumn"
                styleClass="prime-select-option" placeholder="Chọn Cột Hiển Thị" appendTo="body">
              </p-multiSelect>
              <ng-select [placeholder]="'Tổng số trang...'" name="changePagination" [clearable]="false"
                (ngModelChange)="filterPagination($event)" [(ngModel)]="numberPage" class="prime-select-option">
                <ng-option *ngFor="let item of listChoosePagination" [value]=" item.key">{{
                  item.value}}</ng-option>
              </ng-select>
            </div>
          </ng-template>
          <!-- Header -->
          <ng-template pTemplate="header" let-columns>
            <tr>
              <th class="text-center"></th>
              <!-- STT -->
              <th class="text-center"> # </th>
              <!-- COLUMNS -->
              <th [pSortableColumn]="item.field" class="text-center" *ngFor="let item of columns">
                <div class="d-flex justify-content-evenly">
                  <!-- Mặc định -->
                  <span>&nbsp;</span>
                  <!-- Label -->
                  <span class="text-capitalize">
                    {{item.header}}
                    <!-- Sort -->
                    <p-sortIcon [field]="item.field"></p-sortIcon>
                  </span>
                  <!-- tất cả trường không có filter -->
                  <span>
                    &nbsp;
                  </span>
                  <!-- Filter by Text -->
                  <p-columnFilter type="text" *ngIf="item.field == 'title' ||  item.field == 'floor_Title' "
                    [field]="item.field" display="menu" [operator]="'or'" [showOperator]="false" [showAddButton]="false"
                    class="p-element float-end">
                    <div class="p-column-filter  p-column-filter-menu">
                      <button type="button" aria-haspopup="true" class="p-column-filter-menu-button p-link"
                        aria-expanded="false">
                        <span class="pi pi-filter-icon pi-filter "></span>
                      </button>
                    </div>
                  </p-columnFilter>
                  <p-columnFilter *ngIf="item.field == 'roomType_Title'" [field]="item.field" [showOperator]="false"
                    matchMode="equals" display="menu">
                    <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                      <ng-template let-option pTemplate="item">
                        <span [class]="'customer-badge status-' + option.value">{{option.label}}</span>
                      </ng-template>
                    </ng-template>
                  </p-columnFilter>
                  <p-columnFilter *ngIf="item.field == 'roomStatus_Title'" [field]="item.field" [showOperator]="false"
                    matchMode="equals" display="menu">
                    <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                      <ng-template let-option pTemplate="item">
                        <span [class]="'customer-badge status-' + option.value">{{option.label}}</span>
                      </ng-template>
                    </ng-template>
                  </p-columnFilter>
                </div>
              </th>
            </tr>
          </ng-template>
          <!-- BODY -->
          <ng-template pTemplate="body" let-item let-columns="columns" let-rowIndex="rowIndex">
            <tr>
              <td class="text-center">
                <button type="button" tooltip="chào" class="btn btn-link btn-sm text-muted"
                  (click)="chooseProductShowHome(item)" tooltip="Sửa" data-bs-toggle="modal">
                  <i class="fa fa-home text-primary"></i>
                </button>
                <button type="button" tooltip="chào" class="btn btn-link btn-sm text-muted" (click)="update(item)"
                  tooltip="Sửa" data-bs-toggle="modal">
                  <i class="fa fa-pencil text-warning"></i>
                </button>
                <button type="button" class="btn btn-link btn-sm text-muted" tooltip="Xóa" (click)="delete(item)">
                  <i class="fa fa-trash text-danger"></i>
                </button>
              </td>
              <!-- STT -->
              <td> {{ ((pagination.pageNumber - 1) * pagination.pageSize) + rowIndex + 1 }} </td>
              <!-- DATA -->
              <td *ngFor="let col of columns" [ngClass]="col.field == 'main_image_url' ? 'text-center' :''">
                <ng-container *ngIf="col.field != 'main_image_url' ">{{item[col.field]}}</ng-container>
                <ng-container *ngIf="col.field == 'main_image_url'">
                  <img [src]="item[col.field] != null ? item[col.field] : 'assets/images/NO-PHOTO_165x165.png'"
                    class="rounded lg avatar" [alt]="item[col.field]">
                </ng-container>
              </td>
            </tr>
          </ng-template>
          <!-- MESSAGE WHEN EMPTY -->
          <ng-template pTemplate="emptymessage" *ngIf="listProducts.length == 0">
            <tr>
              <td colspan="100%" class="text-center font-weight-bold">
                <span class="text-danger">No Data</span>
              </td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </div>
    <!-- Pagination -->
    <div class="d-flex justify-content-center" style="margin-bottom: 0.5rem" *ngIf="pagination.totalPage > 1">
      <pagination [boundaryLinks]="true" [totalItems]="pagination.totalCount" [itemsPerPage]="pagination.pageSize"
        previousText="&lsaquo;" [(ngModel)]="pagination.pageNumber" (pageChanged)="pageChanged($event)"
        nextText="&rsaquo;" firstText="&laquo;" lastText="&raquo;" [maxSize]="5">
      </pagination>
    </div>
  </div>
</div>

<div bsModal #modalAdd="bs-modal" class="modal fade" tabindex="-1" [config]="{backdrop: 'static'}" role="dialog"
  aria-labelledby="dialog-sizes-name1">
  <form class="modal-dialog modal-lg modal-dialog-scrollable" #myForm="ngForm" autocomplete="off" (ngSubmit)="send()">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title text-uppercase fw-bold">Show Product Home</h5>
        <button type="button" class="btn-close" (click)="modalAdd.hide()" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-12">
            <label for="TextInput" class="form-label fw-bold">Item name : </label>
            <span class="ms-2">{{productHomeModel.item_name}}</span>
          </div>
          <div class="col-md-12 d-flex">
            <label for="TextInput" class="form-label fw-bold">IsLatest:</label>
            <input class="form-check-input ms-2" [(ngModel)]="productHomeModel.isLatest" type="checkbox" name="isLatest"
              role="switch" [checked]="productHomeModel.isLatest" />
          </div>
          <div class="col-md-12 d-flex">
            <label for="TextInput" class="form-label fw-bold">IsPopular:</label>
            <input class="form-check-input ms-2" [(ngModel)]="productHomeModel.isPopular" type="checkbox"
              name="isPopular" role="switch" [checked]="productHomeModel.isPopular" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-success me-2 lift rounded-2" type="submit">
          <i class="fa fa-save"></i> Save
        </button>
      </div>
    </div>
  </form>
</div>

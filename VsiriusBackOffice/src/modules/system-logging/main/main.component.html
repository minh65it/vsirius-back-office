<div class="col-md-12">
  <div class="card">
    <div class="card-header d-block">
      <form class="row g-3" (ngSubmit)="search()" autocomplete="off">
        <div class="col-lg-4 col-md-4 col-sm-12">
          <ng-select [placeholder]="'Project Name...'" name="projectName" (close)="changeFilterProjectName($event)"
            [(ngModel)]="logParams.projectName" (clear)="clearProjectName()">
            <ng-option *ngFor="let item of filterProjectName" [value]="item">{{
              item}}</ng-option>
          </ng-select>
        </div>
        <div class="col-lg-4 col-md-4 col-sm-12">
          <ng-select [placeholder]="'Controller Name...'" name="filterControllerName" (clear)="clearController()"
            (close)="changeFilterControllerName($event)" [(ngModel)]="logParams.controllerName">
            <ng-option *ngFor="let item of filterControllerName" [value]="item">{{
              item}}</ng-option>
          </ng-select>
        </div>
        <div class="col-lg-4 col-md-4 col-sm-12">
          <ng-select [placeholder]="'Method Name...'" name="filterMethodName" (close)="changeFilterMethodName($event)"
            [(ngModel)]="logParams.method">
            <ng-option *ngFor="let item of filterMethodName" [value]="item">{{
              item}}</ng-option>
          </ng-select>
        </div>
        <div class="col-lg-3 col-md-3 col-sm-6">
          <fieldset class="form-icon-group left-icon position-relative">
            <input type="text" [(ngModel)]="searchFrom" name="searchFrom" bsDatepicker
              [bsConfig]="{ isAnimated: true, dateInputFormat: 'MM/DD/YY' }" class="form-control"
              placeholder="Choose time from" />
            <div class="form-icon position-absolute">
              <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
          </fieldset>
        </div>
        <div class="col-lg-3 col-md-3 col-sm-6">
          <fieldset class="form-icon-group left-icon position-relative">
            <input type="text" [(ngModel)]="searchTo" name="searchTo" bsDatepicker
              [bsConfig]="{ isAnimated: true, dateInputFormat: 'MM/DD/YY' }" class="form-control"
              placeholder="Choose time to" />
            <div class="form-icon position-absolute">
              <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
          </fieldset>
        </div>
        <div class="col-lg-6 col-md-6 col-sm-12">
          <div class="input-group">
            <input class="form-control rounded" type="text" [(ngModel)]="fullTextSearch" autocomplete="off"
              name="keyword" placeholder="Enter search keywords...." />
            <button type="submit" class="btn btn-secondary ms-2 border lift rounded-2">
              <i class="fa fa-search"></i>
              Search
            </button>
            <button type="button" (click)="clear()" class="btn btn-danger ms-2 border lift rounded-2">
              <i class="fa fa-trash"></i>
              Clear
            </button>
          </div>
        </div>

      </form>
      <div class="card-body table-scroll-view">
        <p-table responsiveLayout="scroll" [value]="listLogDto" dataKey="id" [rows]="listLogDto?.length">
          <ng-template pTemplate="header">
            <tr>
              <th style="width:5%"></th>
              <th pSortableColumn="projectName" style="width:20%">Project Name <p-sortIcon
                  field="projectName"></p-sortIcon></th>
              <th pSortableColumn="controllerName" style="width:20%">Controller Name <p-sortIcon
                  field="controllerName"></p-sortIcon></th>
              <th pSortableColumn="method" style="width:20%">Method <p-sortIcon field="method"></p-sortIcon></th>
              <th pSortableColumn="level" style="width:20%">Level<p-sortIcon field="level"></p-sortIcon></th>
              <th pSortableColumn="timeStamp" style="width:20%">Date<p-sortIcon field="timeStamp"></p-sortIcon></th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-log>
            <tr>
              <td class="text-center">
                <button type="button" class="btn btn-link btn-sm text-muted" (click)="getDetail(log?.logId)"
                  tooltip="Chi tiết" data-bs-toggle="modal">
                  <i class="fa fa-info text-success"></i>
                </button>
              </td>
              <td>{{ log.projectName }}</td>
              <td>{{ log.controllerName }}</td>
              <td>{{ log.method }}</td>
              <td>{{ log.level }}</td>
              <td>{{ log.timeStamp | date : 'MM/dd/YY' }}</td>
            </tr>
          </ng-template>
          <!-- MESSAGE WHEN EMPTY -->
          <ng-template pTemplate="emptymessage" *ngIf="listLogDto == null">
            <tr>
              <td colspan="100%" class="text-center font-weight-bold">
                <span class="text-danger">No Data</span>
              </td>
            </tr>`
          </ng-template>
        </p-table>
      </div>
    </div>
    <!-- Pagination -->
    <div class="d-flex justify-content-center" style="margin-bottom: 0.5rem" *ngIf="pagination.totalPage > 1">
      <pagination [boundaryLinks]="true" [totalItems]="pagination.totalCount" [itemsPerPage]="pagination.pageSize"
        previousText="&lsaquo;" [(ngModel)]="pagination.pageNumber" (pageChanged)="pageChanged($event)"
        nextText="&rsaquo;" firstText="&laquo;" lastText="&raquo;" [maxSize]="5">
      </pagination>
    </div>
  </div>
</div>

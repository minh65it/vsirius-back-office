<div class="col-md-12">
  <div class="card">
    <div class="card-header d-block">
      <form class="row g-3" (ngSubmit)="search()" autocomplete="off">
        <div class="col-lg-4 col-md-6 col-sm-12">
          <ng-select [placeholder]="'Level log...'" name="levelLog" [(ngModel)]="logParams.level">
            <ng-option *ngFor="let item of levelLog | keyvalue" [value]="item.key">{{
              item.value}}</ng-option>
          </ng-select>
        </div>
        <div class="col-lg-4 col-md-6 col-sm-12">
          <ng-select [placeholder]="'Project...'" name="projectName" (close)="changeFilterProjectName($event)"
            [(ngModel)]="logParams.projectName" (clear)="clearProjectName()">
            <ng-option *ngFor="let item of filterProjectName" [value]="item">{{
              item}}</ng-option>
          </ng-select>
        </div>
        <div class="col-lg-4 col-md-6 col-sm-12">
          <ng-select [placeholder]="'Url...'" name="filterUrl" (clear)="clearFilterUrl()"
            (close)="changeFilterUrl($event)" [(ngModel)]="logParams.uRL">
            <ng-option *ngFor="let item of filterUrl" [value]="item">{{
              item}}</ng-option>
          </ng-select>
        </div>
        <div class="col-lg-4 col-md-6 col-sm-12">
          <input class="form-control rounded" type="text" [(ngModel)]="logParams.correlationId" autocomplete="off"
            name="correlationId" placeholder="Enter Correlation Id...." />
        </div>
        <div class="col-lg-4 col-md-3 col-sm-6">
          <fieldset class="form-icon-group left-icon position-relative">
            <input type="text" [(ngModel)]="searchFrom" name="searchFrom" bsDatepicker [maxDate]="maxDate"
              [bsConfig]="{ isAnimated: true, dateInputFormat: 'MM/DD/YY', adaptivePosition: true }"
              class="form-control" placeholder="Choose time from" />
            <div class="form-icon position-absolute">
              <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
          </fieldset>
        </div>
        <div class="col-lg-4 col-md-3 col-sm-6">
          <fieldset class="form-icon-group left-icon position-relative">
            <input type="text" [(ngModel)]="searchTo" name="searchTo" bsDatepicker [minDate]="searchFrom"
              [maxDate]="maxDate" [bsConfig]="{ isAnimated: true, dateInputFormat: 'MM/DD/YY', adaptivePosition: true }"
              class="form-control" placeholder="Choose time to" />
            <div class="form-icon position-absolute">
              <i class="fa fa-calendar" aria-hidden="true"></i>
            </div>
          </fieldset>
        </div>
        <div class="col-lg-8 col-md-6 col-sm-12">
          <div class="input-group">
            <input class="form-control rounded" type="text" [(ngModel)]="fullTextSearch" autocomplete="off"
              name="keyword" placeholder="Enter search keywords...." />
            <button type="submit" class="btn btn-secondary ms-2 border lift rounded-2">
              <i class="fa fa-search"></i>
              Search
            </button>
            <button type="button" (click)="clear()" class="btn btn-danger ms-2 border lift rounded-2">
              <i class="fa fa-trash"></i>
              Clear
            </button>
          </div>
        </div>
      </form>
      <div class="card-body table-scroll-view">
        <p-table responsiveLayout="scroll" [value]="listLogDto" dataKey="id" [rows]="listLogDto?.length">
          <ng-template pTemplate="header">
            <tr>
              <th style="width:5%"></th>
              <th pSortableColumn="projectName" style="width:20%">Project Name <p-sortIcon
                  field="projectName"></p-sortIcon></th>
              <th pSortableColumn="timeStamp" style="width:20%">Date<p-sortIcon field="timeStamp"></p-sortIcon></th>
              <th pSortableColumn="url" style="width:20%">Url <p-sortIcon field="url"></p-sortIcon></th>
              <th pSortableColumn="url" style="width:20%">Correlation Id <p-sortIcon field="url"></p-sortIcon></th>
              <th pSortableColumn="exception"
                style="max-width: 250px !important; overflow: hidden; text-overflow: ellipsis;">Exception
                <p-sortIcon field="exception"></p-sortIcon>
              </th>
              <th pSortableColumn="level" style="width:10%">Level<p-sortIcon field="level"></p-sortIcon></th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-log>
            <tr>
              <td class="text-center">
                <button type="button" class="btn btn-link btn-sm text-muted" (click)="getDetail(log?.logId)"
                  tooltip="Chi tiết" data-bs-toggle="modal">
                  <i class="fa fa-info text-success"></i>
                </button>
              </td>
              <td>{{ log.projectName }}</td>
              <td>{{ log.timeStamp | date : 'MM/dd/YY HH:mm:ss:SSS' }}</td>
              <td>{{ log.url }}</td>
              <td>{{ log.correlationId }}</td>
              <td style="max-width: 250px !important; overflow: hidden; text-overflow: ellipsis;">{{ log.exception }}
              </td>
              <td>{{ log.level }}</td>
            </tr>
          </ng-template>
          <!-- MESSAGE WHEN EMPTY -->
          <ng-template pTemplate="emptymessage" *ngIf="listLogDto == null">
            <tr>
              <td colspan="100%" class="text-center font-weight-bold">
                <span class="text-danger">No Data</span>
              </td>
            </tr>`
          </ng-template>
        </p-table>
      </div>
    </div>
    <!-- Pagination -->
    <div class="d-flex justify-content-center" style="margin-bottom: 0.5rem" *ngIf="pagination.totalPage > 1">
      <pagination [boundaryLinks]="true" [totalItems]="pagination.totalCount" [itemsPerPage]="pagination.pageSize"
        previousText="&lsaquo;" [(ngModel)]="pagination.pageNumber" (pageChanged)="pageChanged($event)"
        nextText="&rsaquo;" firstText="&laquo;" lastText="&raquo;" [maxSize]="5">
      </pagination>
    </div>
  </div>
</div>

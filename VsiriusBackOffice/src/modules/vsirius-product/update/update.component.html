<div class="card">
    <div class="card-body">
        <form class="row">
            <p-tabView>
                <p-tabPanel *ngFor="let group of groupName" [header]="group">
                    <div class="row">
                        <ng-container *ngFor="let item of listTabView(group)">
                            <div class="col-3 mb-3" *ngIf="item.groupName == group && item.value != null">
                                <label [for]="item.fieldName" class="form-label fw-bold">{{item.labelName}} <span *ngIf="item.groupName == 'Required'" class="text-danger">*</span></label>
                                <ng-select 
                                    (ngModelChange)="onSelectedOptionChange(item.fieldName, $event)"
                                    [(ngModel)]="product[item.fieldName]" [name]="item.fieldName"
                                    [items]="item.value"
                                    ></ng-select>
                            </div>
                            <div class="col-3 mb-2" *ngIf="!item.value && item.groupName == group">
                                <app-input-custom ngDefaultControl [label]="item.fieldName"
                                    [isValidate]="item.groupName == 'Required'"
                                    (valueChanged)="onInputValueChanged($event,item.fieldName)" [model]="product[item.fieldName]
                                    "></app-input-custom>
                            </div>
                        </ng-container>
                    </div>
                </p-tabPanel>
            </p-tabView>
        </form>
    </div>
    <div class="card-footer text-end" *ngIf="listFieldData.length > 0">
        <button class="btn btn-success lift me-2 rounded-2" type="button" (click)="save()">
            <i class="fa fa-save"></i> Lưu
        </button>
        <button class="btn btn-danger lift rounded-2" type="button" (click)="cancel()">
            <i class="fa fa-close"></i>
            Hủy
        </button>
    </div>
</div>

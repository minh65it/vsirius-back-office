<div class="col-md-12">
  <div class="card">
    <div class="card-header d-block">
      <form class="row g-3" (ngSubmit)="search()">
        <div class="col-lg-3 col-md-3 col-sm-12">
          <ng-select [placeholder]="'feed_product_type...'" name="feed_product_type"
            (ngModelChange)="filterProductType($event)" [(ngModel)]="productType">
            <ng-option *ngFor="let item of listProductType.toString().split(',')" [value]="item">{{
              item}}</ng-option>
          </ng-select>
        </div>
        <div class="col-lg-3 col-md-3 col-sm-12">
          <ng-select [placeholder]="'item_type...'" [disabled]="isShowSelect"  [multiple]="true"
            (ngModelChange)="filterItemType($event)" [(ngModel)]="item_type" name="item_type">
            <ng-option *ngFor="let item of listItemType.toString().split(',')" [value]="item">{{
              item}}</ng-option>
          </ng-select>
        </div>
        <div class="col-lg-3 col-md-3 col-sm-12">
          <ng-select [placeholder]="'metal_type...'" name="metal_type" [disabled]="isShowSelect" [multiple]="true"
            (ngModelChange)="filterMetalType($event)" [(ngModel)]="metal_type">
            <ng-option *ngFor="let item of listMetalType.toString().split(',')" [value]="item">{{
              item}}</ng-option>
          </ng-select>
        </div>
        <div class="col-lg-12 col-md-12 col-sm-12">
          <div class="input-group">
            <input class="form-control rounded" type="text" [(ngModel)]="keyword" autocomplete="off" name="keyword"
              placeholder="Enter search keywords...." />
            <button type="submit" class="btn btn-secondary me-2 ms-2 border lift rounded-2">
              <i class="fa fa-search"></i>
              Search
            </button>
            <button class="btn btn-primary lift me-2 rounded-2" (click)="goToAdd()" type="button">
              <i class="fa fa-plus"></i>
              Add new
            </button>
            <button class="btn btn-success lift me-2 rounded-2" type="button" (click)="fileInput.click()">
              <i class="fa fa-upload"></i>
              Import file
            </button>
            <input #fileInput type="file" style="display: none;" (change)="onFileSelected($event)">
          </div>
        </div>

      </form>
      <div class="card-body table-scroll-view">
        <p-table [columns]="selectedColumns" responsiveLayout="scroll" [value]="listProducts" dataKey="id"
          [rows]="listProducts.length">
          <!-- Thanh Chọn Cột -->
          <ng-template pTemplate="caption">
            <div class="flex">
              <p-multiSelect [options]="cols" [(ngModel)]="selectedColumns" (click)="removeFilterSearch()"
                optionLabel="header" class="chooseColumn" styleClass="prime-select-option"
                placeholder="Chọn Cột Hiển Thị" appendTo="body">
              </p-multiSelect>
              <ng-select [placeholder]="'Tổng số trang...'" name="changePagination"
                (ngModelChange)="filterPagination($event)" [(ngModel)]="numberPage" class="prime-select-option">
                <ng-option *ngFor="let item of listChoosePagination" [value]=" item.key">{{
                  item.value}}</ng-option>
              </ng-select>
            </div>
          </ng-template>
          <!-- Header -->
          <ng-template pTemplate="header" let-columns>
            <tr>
              <th class="text-center"></th>
              <!-- STT -->
              <th class="text-center"> # </th>
              <!-- COLUMNS -->
              <th [pSortableColumn]="item.field" class="text-center" *ngFor="let item of columns">
                <div class="d-flex justify-content-evenly">
                  <!-- Mặc định -->
                  <span>&nbsp;</span>
                  <!-- Label -->
                  <span class="text-capitalize">
                    {{item.header}}
                    <!-- Sort -->
                    <p-sortIcon [field]="item.field"></p-sortIcon>
                  </span>
                  <!-- tất cả trường không có filter -->
                  <span>
                    &nbsp;
                  </span>
                  <!-- Filter by Text -->
                  <p-columnFilter type="text" *ngIf="item.field == 'title' ||  item.field == 'floor_Title' "
                    [field]="item.field" display="menu" [operator]="'or'" [showOperator]="false" [showAddButton]="false"
                    class="p-element float-end">
                    <div class="p-column-filter  p-column-filter-menu">
                      <button type="button" aria-haspopup="true" class="p-column-filter-menu-button p-link"
                        aria-expanded="false">
                        <span class="pi pi-filter-icon pi-filter "></span>
                      </button>
                    </div>
                  </p-columnFilter>
                  <p-columnFilter *ngIf="item.field == 'roomType_Title'" [field]="item.field" [showOperator]="false"
                    matchMode="equals" display="menu">
                    <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                      <ng-template let-option pTemplate="item">
                        <span [class]="'customer-badge status-' + option.value">{{option.label}}</span>
                      </ng-template>
                    </ng-template>
                  </p-columnFilter>
                  <p-columnFilter *ngIf="item.field == 'roomStatus_Title'" [field]="item.field" [showOperator]="false"
                    matchMode="equals" display="menu">
                    <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                      <ng-template let-option pTemplate="item">
                        <span [class]="'customer-badge status-' + option.value">{{option.label}}</span>
                      </ng-template>
                    </ng-template>
                  </p-columnFilter>
                </div>
              </th>
            </tr>
          </ng-template>
          <!-- BODY -->
          <ng-template pTemplate="body" let-item let-columns="columns" let-rowIndex="rowIndex">
            <tr>
              <td class="text-center">
                <button type="button" class="btn btn-link btn-sm text-muted" (click)="update(item)" tooltip="Sửa"
                  data-bs-toggle="modal" data-bs-target="#RequestQuoteEdit">
                  <i class="fa fa-pencil text-warning"></i>
                </button>
                <button type="button" class="btn btn-link btn-sm text-muted" tooltip="Xóa" (click)="delete(item)">
                  <i class="fa fa-trash text-danger"></i>
                </button>
              </td>
              <!-- STT -->
              <td> {{ ((pagination.pageNumber - 1) * pagination.pageSize) + rowIndex + 1 }} </td>
              <!-- DATA -->
              <td *ngFor="let col of columns">
                <ng-container *ngIf="col.field != 'price' ">{{item[col.field]}}</ng-container>
                <ng-container *ngIf="col.field == 'price' ">{{item[col.field] | number}}</ng-container>
              </td>
            </tr>
          </ng-template>
          <!-- MESSAGE WHEN EMPTY -->
          <ng-template pTemplate="emptymessage" *ngIf="listProducts.length == 0">
            <tr>
              <td colspan="100%" class="text-center font-weight-bold">
                <span class="text-danger">No Data</span>
              </td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </div>
    <!-- Pagination -->
    <div class="d-flex justify-content-center" style="margin-bottom: 0.5rem" *ngIf="pagination.totalPage > 1">
      <pagination [boundaryLinks]="true" [totalItems]="pagination.totalCount" [itemsPerPage]="pagination.pageSize"
        previousText="&lsaquo;" [(ngModel)]="pagination.pageNumber" (pageChanged)="pageChanged($event)"
        nextText="&rsaquo;" firstText="&laquo;" lastText="&raquo;" [maxSize]="5">
      </pagination>
    </div>
  </div>
</div>
